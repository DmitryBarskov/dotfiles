- defaults:
    link:
      relink: true
      create: true

- clean:
    ~/:
      force: true

- link:
    ~/.bashrc: bashrc
    ~/.bash_profile: bash_profile
    ~/.zshrc: zshrc
    ~/.config:
      path: config
      force: true
    ~/.config/VSCodium/User/settings.json: config/Code/User/settings.json
    '~/Library/Application Support/Code':
      if: '[ `uname` = Darwin ]'
      path: config/Code
    '~/Library/Application Support/VSCodium':
      if: '[ `uname` = Darwin ]'
      path: config/VSCodium
    '~/Library/Application Support/Sublime Text 3':
      if: '[ `uname` = Darwin ]'
      path: config/sublime-text-3
    '~/Library/Application Support/Sublime Text':
      if: '[ `uname` = Darwin ]'
      path: config/sublime-text-4
    ~/Library/Preferences/com.googlecode.iterm2.plist:
      if: '[ `uname` = Darwin ]'
      force: true
      path: config/iterm2/com.googlecode.iterm2.plist

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [ln -sf ./kitty-themes/themes/Solarized_Dark.conf ~/.config/kitty/theme.conf,
        Setting kitty color scheme to Solarized_Dark]
